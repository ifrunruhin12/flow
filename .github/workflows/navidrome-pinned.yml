name: pinned Navidrome contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.sum
      - name: Create deterministic audio fixture
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ./dev/create-audio-fixture.sh
      - name: Start pinned Navidrome
        working-directory: .
        run: docker compose -p flow-contract -f deploy/docker-compose.dev.yml -f deploy/docker-compose.playback-test.yml up -d navidrome
      - name: Wait for Navidrome
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4533/ping && exit 0
            sleep 1
          done
          docker compose -p flow-contract -f deploy/docker-compose.dev.yml -f deploy/docker-compose.playback-test.yml logs navidrome
          exit 1
      - name: Run real contract suite
        env:
          FLOW_REAL_NAVIDROME_URL: http://127.0.0.1:4533
          FLOW_REAL_NAVIDROME_ADMIN_USERNAME: flow-m0-admin
          FLOW_REAL_NAVIDROME_ADMIN_PASSWORD: flow-m0-admin-password
          FLOW_REAL_NAVIDROME_CREATE_ADMIN: "true"
          FLOW_REAL_NAVIDROME_ALLOW_MUTATION: "true"
          FLOW_REAL_NAVIDROME_VERSION: "0.64.2"
        run: go test -tags=integration -run PinnedNavidrome -v ./integration
      - name: Record pulled image digest
        if: always()
        working-directory: .
        run: docker image inspect deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52 --format '{{json .RepoDigests}}' | tee navidrome-image-digest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navidrome-image-digest
          path: navidrome-image-digest.txt
      - name: Dispose test Navidrome volume
        if: always()
        working-directory: .
        run: docker compose -p flow-contract -f deploy/docker-compose.dev.yml -f deploy/docker-compose.playback-test.yml down -v
