services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow-dev-only
    ports:
      - "127.0.0.1:${FLOW_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - flow_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 2s
      timeout: 2s
      retries: 30

  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_ENABLEDOWNLOADS: "false"
      ND_ENABLEARTWORKUPLOAD: "false"
      ND_ENABLESHARING: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_DEVACTIVITYPANEL: "false"
      ND_DEVUISHOWCONFIG: "true"
      ND_AUTHREQUESTLIMIT: "60"
      ND_AUTHWINDOWLENGTH: 5m
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - ../dev/music-root/library:/music:ro
      - navidrome_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4533/ping"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  flow_pg_dev:
  navidrome_data_dev:
